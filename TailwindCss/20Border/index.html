<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="m-10">
      <div class="p-2 mb-10 w-48 text-center border">Normal Border</div>
      <div class="p-2 mb-10 w-48 text-center border border-4">Border Width</div>
      <div class="p-2 mb-10 w-48 text-center border border-2 border-blue-600">
        Coloured Border
      </div>
      <div
        class="p-2 mb-10 w-48 text-center border border-3 border-t-red-600 border-r-green-600 border-b-blue-600 border-l-yellow-600"
      >
        4 sided colour Border
      </div>
      <div
        class="p-2 mb-10 w-48 text-center border border-3 border-t-red-600 border-t-8 border-r-green-600 border-r-6 border-b-blue-600 border-b-4 border-l-yellow-600 border-l-2"
      >
        4 sided different Border width
      </div>
      <div class="border size-24 p-3 rounded-full">Rounded Border</div>
    </div>
  </body>
</html>
