<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="dark:bg-gray-800 dark:text-white">Hello</h1>
    <button
      class="dark:bg-gray-800 dark:text-white p-1 border bg-blue-600 text-white m-5"
    >
      Hello
    </button>
  </body>
</html>
